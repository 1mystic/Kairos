name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # allowBuilds in pnpm-workspace.yaml lets esbuild etc. run their build scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @kairos/core test:coverage
      - run: pnpm --filter @kairos/app test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
          retention-days: 7
          if-no-files-found: error

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: npm i -g firebase-tools
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json', 'firestore.rules') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: pnpm test:rules

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline/tests
      - run: python -m pipeline.validate pipeline/fixtures/questions
      - name: Published bank is up to date (determinism check)
        run: |
          # Re-publish v3 into a temp dir and compare file hashes with the
          # committed manifest. Images are written to <out>/../img, so the
          # temp tree never touches app/public.
          out="$RUNNER_TEMP/bank-check/bank"
          python -m pipeline.publish --version 8 --out "$out"
          python - "$out/v3/manifest.json" app/public/bank/v3/manifest.json <<'PY'
          import json, sys
          fresh, committed = (json.load(open(p)) for p in sys.argv[1:3])
          def hashes(m, key):
              return {e["path"]: e["sha256"] for e in m[key]}
          bad = False
          for key in ("files", "images"):
              a, b = hashes(fresh, key), hashes(committed, key)
              for path in sorted(set(a) | set(b)):
                  if a.get(path) != b.get(path):
                      bad = True
                      print(f"STALE {key}: {path}: committed={b.get(path)} fresh={a.get(path)}")
          if bad:
              sys.exit("Published bank differs from pipeline output. Re-run `python -m pipeline.publish --version 8 --force` and commit.")
          print("published bank matches pipeline output")
          PY

